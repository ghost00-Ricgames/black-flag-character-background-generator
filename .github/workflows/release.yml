name: Validate and package
on:
  push:
    branches: [main, 'development/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in scripts/*.mjs; do node --check "$file"; done
      - name: Run Foundry API integration tests
        run: node --test tests/*.test.mjs
      - name: Validate manifest
        run: node scripts/validate-manifest.mjs
      - name: Build installable zip
        run: |
          mkdir -p dist
          mkdir -p dist/stage/black-flag-character-background-generator
          cp -R module.json scripts styles LICENSE README.md dist/stage/black-flag-character-background-generator/
          (cd dist/stage && zip -r ../black-flag-character-background-generator.zip black-flag-character-background-generator -x '*.DS_Store')
          rm -rf dist/stage
          cp module.json dist/module.json
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: black-flag-character-background-generator
          path: dist/
      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/black-flag-character-background-generator.zip dist/module.json --title "${GITHUB_REF_NAME}" --prerelease --generate-notes
